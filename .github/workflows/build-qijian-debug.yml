name: Build Qijian Android debug APK

on:
  push:
    branches:
      - fix/subscription-model-selection-theme-docs
    paths:
      - '.github/workflows/build-qijian-debug.yml'
      - 'src/**'
      - 'android/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'public/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Type-check and build web assets
        run: npm run build
      - name: Run vision attachment regression tests
        run: node --test tests/vision-attachments.test.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Upload Qijian debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qijian-debug-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
